<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedBack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=SN+Pro:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=SN+Pro:ital,wght@0,500;1,500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./src/scss/main.css" />
</head>

<body>

    <div class="frame">
        <div class="modal">
            <div class="close-icon">
                <img class="close-img" src="./src/img/icon-close.svg" alt="close">
            </div>
            <div class="title">
                <h2>How likely are you to recommend FrontendPro to someone you know?</h2>
            </div>

            <div class="numbers">

            </div>


            <div class="rating-labels">
                <span class="rate-nlike">Not likely at all</span>
                <span class="rate-like">Extremely Likely</span>
            </div>

            <div class="action">
                <button class="cancel-btn" type="button">Cancel</button>
                <button class="submit-btn" type="button">Submit</button>
            </div>
        </div>
    </div>

    <button class="start-btn" type="button">Start</button>

    <script src="./src/js/script.js"></script>
</body>

</html>
